# Local stack: auth server, gateway, Redis (rate limits) and a WireMock stand-in for order-service.
#   docker compose up --build
# To front the real services instead, point ORDERS_URI at commerce-order-platform's order-service.
services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  orders-stub:
    image: wiremock/wiremock:3.9.1
    command: ["--global-response-templating"]
    volumes:
      - ./stubs:/home/wiremock:ro

  auth-server:
    build:
      context: .
      dockerfile: auth-server/Dockerfile
    ports: ["9000:9000"]
    environment:
      ISSUER_URI: http://localhost:9000

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports: ["8080:8080"]
    environment:
      REDIS_HOST: redis
      JWK_SET_URI: http://auth-server:9000/oauth2/jwks
      ORDERS_URI: http://orders-stub:8080
      RATE_LIMIT_PER_SECOND: "5"
      RATE_LIMIT_BURST: "10"
    depends_on: [redis, auth-server, orders-stub]
