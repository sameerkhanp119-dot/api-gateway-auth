apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-server
  namespace: edge
  labels: { app: auth-server }
spec:
  replicas: 2
  selector:
    matchLabels: { app: auth-server }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: auth-server }
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: auth-server
          image: ghcr.io/sameerkhanp119-dot/auth-server:latest
          ports:
            - containerPort: 9000
          env:
            - name: ISSUER_URI
              value: https://auth.sameerkhanpathan.com
            - name: ORDER_PORTAL_SECRET
              valueFrom: { secretKeyRef: { name: oauth-clients, key: order-portal } }
            - name: REPORTING_JOB_SECRET
              valueFrom: { secretKeyRef: { name: oauth-clients, key: reporting-job } }
          resources:
            requests: { cpu: 200m, memory: 320Mi }
            limits: { memory: 640Mi }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 9000 }
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 9000 }
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-server
  namespace: edge
spec:
  selector: { app: auth-server }
  ports:
    - port: 80
      targetPort: 9000
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: auth-server
  namespace: edge
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: auth-server }
