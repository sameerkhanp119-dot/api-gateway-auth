server:
  port: 9000

spring:
  application:
    name: auth-server
  security:
    oauth2:
      authorizationserver:
        issuer: ${ISSUER_URI:http://localhost:9000}
        client:
          order-portal:
            registration:
              client-id: order-portal
              client-secret: "{noop}${ORDER_PORTAL_SECRET:portal-secret}"
              client-authentication-methods: [client_secret_basic]
              authorization-grant-types: [client_credentials]
              scopes: [orders.read, orders.write]
            token:
              access-token-time-to-live: 15m
          reporting-job:
            registration:
              client-id: reporting-job
              client-secret: "{noop}${REPORTING_JOB_SECRET:reporting-secret}"
              client-authentication-methods: [client_secret_basic]
              authorization-grant-types: [client_credentials]
              scopes: [orders.read]
            token:
              access-token-time-to-live: 15m

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
